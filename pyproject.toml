[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sure-vl"
version = "0.1.0"
description = "Teacher-grounded internal visual certainty and answer calibration for VLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate>=1.10",
  "datasets>=4.7",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers>=5.4,<6",
  "trl[vlm]==1.14.1",
]

[project.scripts]
sure-vl = "sure_vl.cli:main"
sure-vl-train = "sure_vl.train_proxy:main"
sure-vl-train-legacy = "sure_vl.train_trl:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sure_vl"]
